name: Hourly EMA scan
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema-hourly
  cancel-in-progress: false
jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan assigned assets
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'
          SCAN_TARGET: '2000'
        run: python worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema-shard-${{ matrix.shard }}
          path: shards/shard-*.json
          if-no-files-found: ignore
          retention-days: 2
  merge:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ema-shard-*
          path: shards
          merge-multiple: true
      - run: python merge_shards.py
      - name: Save latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update distributed EMA snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
